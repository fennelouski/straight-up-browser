name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  RUN_UI_TESTS: 1

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run build and test gates
        # The runner has no protected-folder consent to trip, so keep the
        # derived data in-tree where the upload step below can find it.
        env:
          DERIVED_DATA_ROOT: build/verification
        run: ./scripts/verify.sh

      - name: Upload result bundles on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verification-xcresults
          path: build/verification/*.xcresult
          if-no-files-found: warn
          retention-days: 7
