<!doctype html><meta charset="utf-8"><title>Credential verification</title>
<style>body{font:20px system-ui;margin:80px;background:#f2f5fa}input,button{display:block;font:inherit;margin:14px 0;padding:12px}output{display:block;margin-top:24px}</style>
<h1>Credential verification</h1><form><label>Username<input name="username"></label><label>Password<input name="password" type="password"></label><button>Sign in</button></form><output>Ready</output>
<script>document.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const f=e.target;document.querySelector('output').textContent='Submitted: '+f.username.value+'; password matches test value: '+(f.password.value==='Verify-Only-123!')+'; updated value matches: '+(f.password.value==='Verify-Updated-456!');});</script>
